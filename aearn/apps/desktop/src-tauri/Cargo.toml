[package]
name = "aearn-desktop"
version = "0.1.0"
description = "Desktop shell for Aearn."
authors = ["PINKING"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
