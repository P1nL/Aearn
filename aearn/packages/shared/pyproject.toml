[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aearn-shared"
version = "0.1.0"
description = "Pure shared execution contracts for Aearn services."
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic",
]

[tool.setuptools]
packages = ["aearn_shared", "aearn_shared.execution"]

[tool.setuptools.package-data]
aearn_shared = ["py.typed"]
