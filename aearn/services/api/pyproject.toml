[project]
name = "aearn-api"
version = "0.1.0"
description = "FastAPI service prerequisites for Aearn Tutor Harness runtime."
requires-python = ">=3.11,<3.13"
dependencies = [
  "aearn-worker",
  "aearn-shared",
  "fastapi==0.128.0",
  "uvicorn==0.40.0",
  "psycopg[binary,pool]",
  "redis==7.1.0",
  "celery==5.5.3",
  "pydantic",
  "python-dotenv",
  "cryptography>=50.0.0",
  "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "ruff",
  "mypy",
]

[tool.uv]
package = false

[tool.uv.sources]
aearn-worker = { path = "../worker", editable = true }
aearn-shared = { path = "../../packages/shared", editable = true }

[tool.mypy]
mypy_path = ["../worker", "../../packages/shared"]

[tool.pytest.ini_options]
markers = [
  "real_provider: explicit opt-in tests that call the configured real LLM provider",
]
