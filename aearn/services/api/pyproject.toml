[project]
name = "aearn-api"
version = "0.1.0"
description = "FastAPI and LangGraph API service prerequisites for Aearn."
requires-python = ">=3.11,<3.13"
dependencies = [
  "aearn-worker",
  "fastapi==0.128.0",
  "uvicorn==0.40.0",
  "langchain==1.2.0",
  "langchain-openai==1.1.6",
  "langgraph==1.0.5",
  "langgraph-checkpoint-postgres==3.0.2",
  "psycopg[binary,pool]",
  "redis==7.1.0",
  "celery==5.5.3",
  "pydantic",
  "python-dotenv",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "ruff",
  "mypy",
]

[tool.uv]
package = false

[tool.uv.sources]
aearn-worker = { path = "../worker", editable = true }
