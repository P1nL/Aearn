  content:
    type: sql_v2
    dialect: sqlite
    starter_query: SELECT name FROM learners WHERE track = 'python' ORDER BY id;
    tables:
    - name: mentors
      columns:
      - name: id
        data_type: INTEGER
        nullable: false
        primary_key: true
      - name: name
        data_type: TEXT
        nullable: false
        primary_key: false
      foreign_keys: []
    - name: learners
      columns:
      - name: id
        data_type: INTEGER
        nullable: false
        primary_key: true
      - name: name
        data_type: TEXT
        nullable: false
        primary_key: false
      - name: track
        data_type: TEXT
        nullable: false
        primary_key: false
      - name: mentor_id
        data_type: INTEGER
        nullable: true
        primary_key: false
      foreign_keys:
      - column: mentor_id
        references_table: mentors
        references_column: id
    public_dataset:
      tables:
      - table: mentors
        rows:
        - [1, Grace Hopper]
        - [2, Edgar Codd]
      - table: learners
        rows:
        - [1, Ada, python, 1]
        - [2, Grace, sql, 2]
        - [3, Linus, systems, null]
    comparison: ordered
    max_rows: 20
